# nginx: сайт «Дасти Гӯё» на dastiguyo.king.tj
# Статику (frontend/dist) отдаёт nginx, API и модели — FastAPI (uvicorn на 127.0.0.1:8031).
# HTTPS (нужен для камеры и микрофона) добавляет certbot --nginx, см. deploy/setup.sh

server {
    listen 80;
    listen [::]:80;
    server_name dastiguyo.king.tj;

    root /opt/dasti-guyo/frontend/dist;
    index index.html;

    # Аудио в /api/audio — до 2 МБ
    client_max_body_size 3m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/octet-stream model/gltf-binary application/wasm;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://127.0.0.1:8031;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Озвучка и обучение модели могут идти дольше минуты
        proxy_read_timeout 300s;
    }

    location /media/ {
        proxy_pass http://127.0.0.1:8031;
        proxy_set_header Host $host;
    }

    # Service Worker и страница всегда свежие, иначе обновление сайта не доходит до людей
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Файлы сборки с хешем в имени не меняются
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /mediapipe/ {
        types { application/wasm wasm; }
        default_type application/javascript;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
