    <noscript>
      <h1>Дасти Гӯё (Дасти Гуё, Dasti Guyo) — тарҷумони ройгони забони имо</h1>
      <p>Дасти Гӯё — тарҷумони ройгони забони имо барои ношунавоён: камера имоҳоро ба матн ва овоз табдил медиҳад. Бесплатный переводчик жестового языка в Таджикистане.</p>
      <p>Бесплатный переводчик жестового языка для глухих в Таджикистане: камера превращает жесты в текст и голос, 3D-аватар показывает речь жестами. Работает в браузере, без рекламы.</p>
      <p>Барои кор JavaScript-ро фаъол кунед. Для работы сайта включите JavaScript.</p>

    <main class="layout">
      <!-- ===== Видео (общее для обоих экранов) ===== -->
      <section class="stage-col">

            <span class="tr-hands" id="trHands" hidden></span>
            <ol class="tr-feed" id="trFeed" aria-live="polite"></ol>
          <div class="readout" id="readout">
            <div class="readout-top">
              <p class="readout-caption" id="readoutCaption" data-i18n="tr.sees"></p>
              <label class="readout-auto">

              </button>
            </div>
            <p class="readout-word" id="readoutWord" aria-live="polite"></p>
            <div class="readout-meter" id="readoutMeter"><span id="readoutBar"></span></div>
          </div>

          <!-- Предложение из распознанных слов -->
          <section class="sentence" id="sentenceBox">
            <div class="section-head">
              <h2 data-i18n="tr.sentence"></h2>
              <div class="icon-row">
                <button type="button" class="icon-btn" id="btnBackspace" data-i18n-title="tr.eraseWord" data-i18n-aria-label="tr.eraseWord">

                </button>
                <button type="button" class="icon-btn" id="btnShowBig" data-i18n-title="tr.showBig" data-i18n-aria-label="tr.showBig">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>

            <dt data-i18n="status.delegate"></dt>

            <div class="talk-live is-empty" id="talkLive">
              <span class="talk-live-label" data-i18n="talk.deafNow"></span>
              <div class="sentence-words" id="talkLiveWords" lang="tg"></div>
              <p id="talkLiveText" lang="tg" aria-live="polite"></p>
              <button type="button" class="btn btn-primary btn-small" id="talkCamera" data-i18n="camera.start"></button>
            </div>
            <p class="note is-error" id="talkStatus" role="status"></p>
            <form class="talk-input" id="talkForm">
              <button type="button" class="talk-mic" id="talkMic">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>
                <span id="talkMicLabel"></span>
              </button>
              <select id="talkLang" data-i18n-aria-label="tr.micLang">
                <option value="tg-TJ">Тоҷикӣ</option>
                <option value="ru-RU">Русский</option>
              </select>
              <input id="talkInput" autocomplete="off" data-i18n-placeholder="talk.placeholder" data-i18n-aria-label="talk.placeholder" />
              <button type="submit" class="talk-send" data-i18n-title="talk.send" data-i18n-aria-label="talk.send">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12l16-8-6 16-2.5-6.5L4 12z"/></svg>
              </button>
            </form>
          </div>
        </div>
      </section>

      <section class="avatar-page view" data-view="avatar" hidden>
        <div class="av-stage" id="avStage">
          <canvas class="av-canvas" id="avCanvas"></canvas>
          <div class="av-top">
            <span class="av-badge"><i aria-hidden="true"></i><span data-i18n="av.title"></span></span>
            <div class="av-speed" role="group" data-i18n-aria-label="av.speed">
              <button type="button" data-speed="0.75">0.75×</button>
              <button type="button" data-speed="1" aria-pressed="true">1×</button>
              <button type="button" data-speed="1.25">1.25×</button>
            </div>
          </div>
          <div class="av-pick" role="group" data-i18n-aria-label="av.avatar">
            <button type="button" data-avatar="male" data-i18n="av.avatarMale"></button>
            <button type="button" data-avatar="female" data-i18n="av.avatarFemale"></button>
          </div>
          <figure class="av-inset">
            <canvas id="avInset"></canvas>
            <figcaption data-i18n="av.inset"></figcaption>
          </figure>
          <div class="av-loader" id="avLoader">
            <span class="av-ring" aria-hidden="true"></span>
            <span id="avLoaderText"></span>
          </div>
          <div class="av-caption">
            <p class="av-word" id="avWord" aria-live="polite"></p>
            <div class="av-tokens" id="avTokens"></div>
          </div>
          <button type="button" class="av-replay" id="avReplay" data-i18n-title="av.replay" data-i18n-aria-label="av.replay" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 108-8 8.5 8.5 0 00-6 2.5L4 8M4 3v5h5"/></svg>
          </button>
        </div>

        <aside class="av-panel">
          <section class="av-card">
            <h2 data-i18n="av.hearingTitle"></h2>
            <p class="hint" data-i18n="av.hearingHint"></p>
            <div class="av-mic-row">
              <button type="button" class="av-mic" id="avMic" data-i18n-aria-label="av.speak">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>
              </button>
              <div class="av-mic-text">
                <b id="avMicLabel"></b>
                <select id="avLang" data-i18n-aria-label="tr.micLang">
                  <option value="tg-TJ">Тоҷикӣ</option>
                  <option value="ru-RU">Русский</option>
                </select>
              </div>
            </div>
            <textarea id="avText" rows="3" data-i18n-placeholder="av.placeholder"></textarea>
            <button type="button" class="btn btn-primary btn-lg av-go" id="avGo">
              <span data-i18n="av.translate"></span>
            </button>
            <p class="note" id="avStatus" role="status"></p>
            <div class="av-examples">
              <span class="hint" data-i18n="av.examples"></span>
              <div class="av-chips" id="avExamples"></div>
            </div>
          </section>

          <section class="av-card">
            <h2 data-i18n="av.known"></h2>
            <p class="hint" data-i18n="av.knownHint"></p>
            <div class="av-chips" id="avKnown"></div>
          </section>
          <p class="hint" data-i18n="av.note"></p>
        </aside>
      </section>

      <!-- ===== Страница «Идоракунӣ» (содержимое рисует src/ui/adminView.js) ===== -->
      <section class="admin-page view" data-view="admin" hidden>
        <div id="adminRoot"></div>
      </section>

      <!-- ===== Экран «Талаффуз»: тренажёр произношения с голосовым помощником ===== -->
      <section class="speech-page view" data-view="speech" hidden>
        <div id="speechRoot"></div>
      </section>

      <!-- ===== Экран «Профил»: регистрация, вклад в ИИ, знание жестов ===== -->
      <section class="profile-page view" data-view="profile" hidden>
        <div id="profileRoot"></div>
      </section>

      <section class="sos-page view" data-view="sos" hidden>
        <div id="sosRoot"></div>
      </section>

      <section class="about-page view" data-view="about" hidden>
        <div id="aboutRoot"></div>
      </section>

      <section class="support-page view" data-view="support" hidden>
        <div id="supportRoot"></div>
      </section>

      <!-- ===== Экран «Машқ»: тренажёр ===== -->
      <section class="panel view practice" data-view="practice" hidden>
        <div class="practice-card">
          <div id="pIntro">
            <h2 data-i18n="nav.practice"></h2>
            <p id="pIntroText"></p>
          </div>
          <div id="pGame" hidden>
            <div class="practice-top">
              <span id="pRound"></span>
              <b id="pScore"></b>
            </div>
            <p class="practice-label" data-i18n="pr.show"></p>
            <p class="practice-word" id="pWord"></p>
            <p class="demo-ru" id="pRu"></p>
            <canvas class="demo-canvas" id="pCanvas"></canvas>
            <div class="practice-timer"><span id="pTimerBar"></span></div>
            <p class="practice-result" id="pResult" aria-live="polite"></p>
          </div>
          <div class="btn-row">
            <button type="button" class="btn btn-primary btn-lg" id="pStart"></button>
            <button type="button" class="btn btn-secondary" id="pSkip" data-i18n="pr.skip" hidden></button>
          </div>
        </div>
        <p class="hint" data-i18n="pr.hint"></p>
      </section>

      <!-- ===== Экран «Дар бораи ИИ»: как устроена и насколько точна наша нейросеть ===== -->
      <section class="model-page view" data-view="model" hidden>
        <div class="model-hero">
          <p class="model-hero-number" id="mAccuracy">—</p>
          <div class="model-hero-main">
            <p class="model-hero-text" id="mAccuracyText"></p>
            <p class="hint" id="mSource"></p>
            <div class="model-facts" id="mFacts"></div>
          </div>
        </div>

        <section>
          <h2 data-i18n="model.howTitle"></h2>
          <ol class="pipeline">
            <li><i aria-hidden="true">1</i><b data-i18n="model.p1.title"></b><span data-i18n="model.p1.text"></span></li>
            <li><i aria-hidden="true">2</i><b data-i18n="model.p2.title"></b><span data-i18n="model.p2.text"></span></li>
            <li><i aria-hidden="true">3</i><b data-i18n="model.p3.title"></b><span data-i18n="model.p3.text"></span></li>
            <li class="is-ours"><i aria-hidden="true">4</i><b data-i18n="model.p4.title"></b><span id="mArch"></span></li>
            <li><i aria-hidden="true">5</i><b data-i18n="model.p5.title"></b><span data-i18n="model.p5.text"></span></li>
          </ol>
        </section>

        <section class="model-card">
          <h2 data-i18n="model.guardTitle"></h2>
          <p class="hint" data-i18n="model.guardHint"></p>
          <div class="guards" id="mGuards"></div>
        </section>

        <div class="model-grid">
          <section class="model-card">
            <h2 data-i18n="model.curveTitle"></h2>
            <p class="hint" data-i18n="model.curveHint"></p>
            <div id="mCurve"></div>
          </section>
          <section class="model-card">
            <h2 data-i18n="model.dataTitle"></h2>
            <p id="mData"></p>
            <ul class="warnings" id="mConfused"></ul>
            <p class="hint" data-i18n="tr.sourceNote"></p>
          </section>
        </div>

        <section class="model-card">
          <h2 data-i18n="model.perClassTitle"></h2>
          <p class="hint" data-i18n="model.perClassHint"></p>
          <div id="mPerClass" class="per-class"></div>
        </section>
      </section>

      <!-- ===== Экран «Омӯзиш»: пошаговый мастер ===== -->
      <section class="panel view" data-view="train" hidden>
        <p class="lead" data-i18n="train.intro"></p>

        <ol class="steps" id="steps">
          <!-- 1. Камера -->
          <li class="step" data-step="camera">
            <button type="button" class="step-head">
              <span class="step-num">1</span>
              <span class="step-title" data-i18n="step.camera.title"></span>
              <span class="step-summary" id="sumCamera"></span>
            </button>
            <div class="step-body">
              <p data-i18n="step.camera.text"></p>
              <button type="button" class="btn btn-primary" id="btnStepCamera" data-i18n="camera.start"></button>
            </div>
          </li>

          <!-- 2. Жесты -->
          <li class="step" data-step="gestures">
            <button type="button" class="step-head">
              <span class="step-num">2</span>
              <span class="step-title" data-i18n="step.gestures.title"></span>
              <span class="step-summary" id="sumGestures"></span>
            </button>
            <div class="step-body">
              <p data-i18n="step.gestures.text"></p>
              <div class="record-row">
                <label class="sr-only" for="gestureName" data-i18n="train.nameLabel"></label>
                <input id="gestureName" list="gestureNames" autocomplete="off" maxlength="100" data-i18n-placeholder="train.namePlaceholder" />
                <datalist id="gestureNames"></datalist>
                <button type="button" class="btn btn-primary btn-rec" id="btnRecord">
                  <span class="rec-dot" aria-hidden="true"></span>
                  <span data-i18n="train.record"></span>
                </button>
              </div>
              <p class="note" id="recStatus" role="status"></p>
              <div class="gesture-list" id="gestureList"></div>
            </div>
          </li>

          <!-- 3. «Нет жеста» -->
          <li class="step" data-step="none">
            <button type="button" class="step-head">
              <span class="step-num">3</span>
              <span class="step-title" data-i18n="step.none.title"></span>
              <span class="step-summary" id="sumNone"></span>
            </button>
            <div class="step-body">
              <p data-i18n="train.noneHint"></p>
              <button type="button" class="btn btn-primary btn-rec" id="btnRecordNone">
                <span class="rec-dot" aria-hidden="true"></span>
                <span data-i18n="train.recordNone"></span>
              </button>
              <p class="note" id="noneStatus" role="status"></p>
              <div class="gesture-list" id="noneList"></div>
            </div>
          </li>

          <!-- 4. Обучение -->
          <li class="step" data-step="train">
            <button type="button" class="step-head">
              <span class="step-num">4</span>
              <span class="step-title" data-i18n="step.train.title"></span>
              <span class="step-summary" id="sumTrain"></span>
            </button>
            <div class="step-body">
              <p data-i18n="step.train.text"></p>
              <label class="check">
                <input type="checkbox" id="chkUseBase" checked />
                <span data-i18n="train.useBase"></span>
              </label>
              <button type="button" class="btn btn-primary" id="btnTrain" data-i18n="train.train"></button>
              <div class="progress" id="trainProgress" hidden><div class="progress-bar"></div></div>
              <p class="note" id="trainStatus" role="status"></p>
              <div class="train-chart" id="trainChart"></div>
              <p class="hint" id="accNote"></p>
              <ul class="warnings" id="warnings"></ul>
            </div>
          </li>

          <!-- 5. Проверка -->
          <li class="step" data-step="test">
            <button type="button" class="step-head">
              <span class="step-num">5</span>
              <span class="step-title" data-i18n="step.test.title"></span>
              <span class="step-summary"></span>
            </button>
            <div class="step-body">
              <p data-i18n="step.test.text"></p>
              <div class="live" id="liveTest">
                <b class="live-label" id="liveLabel"></b>
                <span class="live-conf" id="liveConf"></span>
                <span class="live-track"><span class="live-bar" id="liveBar"></span></span>
              </div>
            </div>
          </li>
        </ol>

        <details class="more">
          <summary data-i18n="more.title"></summary>
          <h3 data-i18n="file.title"></h3>
          <p class="hint" data-i18n="file.hint"></p>
          <div class="btn-row">
            <button type="button" class="btn btn-secondary" id="btnExport" data-i18n="file.export"></button>
            <label class="btn btn-secondary">
              <input type="file" id="fileImport" accept=".json,application/json" hidden />
              <span data-i18n="file.import"></span>
            </label>
          </div>
          <p class="note" id="fileStatus" role="status"></p>

          <h3 data-i18n="sync.title"></h3>
          <p class="hint" id="syncStatus"></p>
          <div class="btn-row">
            <button type="button" class="btn btn-secondary" id="btnSync" data-i18n="sync.now"></button>
          </div>

          <h3 data-i18n="train.resetTitle"></h3>
          <p class="hint" data-i18n="train.resetHint"></p>
          <div class="btn-row">
            <button type="button" class="btn btn-danger" id="btnResetModel" data-i18n="train.reset"></button>
          </div>

          <h3 data-i18n="howto.title"></h3>
          <ol class="howto">
            <li data-i18n="howto.1"></li>
            <li data-i18n="howto.2"></li>
            <li data-i18n="howto.3"></li>
            <li data-i18n="howto.4"></li>
          </ol>
        </details>
      </section>
    </main>
